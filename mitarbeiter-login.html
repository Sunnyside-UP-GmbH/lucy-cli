<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitarbeiter Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Barlow Semi Condensed', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
        }
        
        .login-container {
            position: relative;
            width: 1200px;
            height: 1920px;
            border-radius: 20px;
            overflow: hidden;
            background: radial-gradient(ellipse at center, 
                rgba(122,206,255,1) 0%,
                rgba(92,187,243,1) 10.677%,
                rgba(61,168,231,1) 21.354%,
                rgba(31,148,218,1) 32.031%,
                rgba(15,139,212,1) 37.37%,
                rgba(0,129,206,1) 42.708%,
                rgba(14,111,169,1) 51.563%,
                rgba(28,93,132,1) 60.417%,
                rgba(41,74,94,1) 69.271%,
                rgba(55,56,57,1) 78.125%);
        }
        
        .login-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 440px;
            height: 440px;
            background-color: #ffffff;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        .login-text {
            font-family: 'Barlow Semi Condensed', sans-serif;
            font-size: 56px;
            font-weight: 400;
            color: #363839;
            text-align: center;
            line-height: 1;
        }
        
        .instruction-text {
            position: absolute;
            top: 608px;
            left: 50%;
            transform: translateX(-50%);
            width: 1030px;
            height: 102px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Barlow Semi Condensed', sans-serif;
            font-size: 56px;
            font-weight: 400;
            color: #ffffff;
            text-align: center;
            line-height: 1;
        }
        
        .icon-button {
            position: absolute;
            bottom: 20px;
            left: 14px;
            width: 80px;
            height: 80px;
            background-color: #363839;
            border-radius: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #ffffff;
        }
        
        .icon {
            width: 50px;
            height: 50px;
            position: relative;
        }
        
        .icon-inner {
            position: absolute;
            top: 16.667%;
            left: 16.667%;
            width: 66.666%;
            height: 66.666%;
            background-color: #ffffff;
            border-radius: 8px;
        }
        
        .logo {
            position: absolute;
            bottom: 95px;
            right: 98px;
            width: 600px;
            height: 125px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 24px;
        }
        
        /* Responsive adjustments */
        @media (max-width: 1200px) {
            .login-container {
                width: 100vw;
                height: 100vh;
                border-radius: 0;
            }
            
            .login-button {
                width: 300px;
                height: 300px;
            }
            
            .login-text {
                font-size: 40px;
            }
            
            .instruction-text {
                width: 90%;
                font-size: 40px;
            }
            
            .logo {
                width: 400px;
                height: 80px;
                right: 20px;
                bottom: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Main Login Button -->
        <div class="login-button">
            <div class="login-text">LOGIN</div>
        </div>
        
        <!-- Instruction Text -->
        <div class="instruction-text">
            <p>Mitarbeiterausweis an das Gerät halten.</p>
        </div>
        
        <!-- Icon Button -->
        <div class="icon-button">
            <div class="icon">
                <div class="icon-inner"></div>
            </div>
        </div>
        
        <!-- Logo Placeholder -->
        <div class="logo">
            [Logo Placeholder]
        </div>
    </div>
</body>
</html>
